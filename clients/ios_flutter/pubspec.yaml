name: strategy_audit_app
description: Deterministic strategy adherence analysis
publish_to: none
version: 0.1.0+1
environment:
  sdk: ">=3.5.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  file_selector: ^1.1.0
  flutter_secure_storage: ^10.3.1
  http: ^1.3.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/rulemirror-logo.png
    - assets/rulemirror-splash.png
    - assets/rulemirror-mark.png
    - assets/fonts/MaterialIcons-Regular.otf
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
